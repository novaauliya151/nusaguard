services:
  - type: web
    name: nusaguard-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nusaguard-db
          property: connectionString
databases:
  - name: nusaguard-db
    databaseName: nusaguard
